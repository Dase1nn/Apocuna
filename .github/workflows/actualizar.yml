name: Actualizar Datos

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar_datos
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-actions.txt

      - name: Instalar dependencias
        run: pip install -r requirements-actions.txt

      - name: Traer datos previos de la rama data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data:refs/remotes/origin/data --depth=1
            git archive origin/data data/generated | tar -x || echo "La rama data existe pero no tiene data/generated."
            echo "Datos previos restaurados desde la rama data."
          else
            echo "La rama data aún no existe; se parte de los datos de main."
          fi

      - name: Diagnóstico CKAN desde GitHub
        continue-on-error: true
        run: |
          for url in \
            "https://www.datosabiertos.gob.pe/api/3/action/package_search?rows=1" \
            "https://datos.minsa.gob.pe/api/3/action/package_search?rows=1"; do
            echo "== $url"
            rm -f /tmp/resp.txt
            curl -sS -A "Mozilla/5.0" -m 15 -o /tmp/resp.txt -w "HTTP %{http_code}\n" "$url" || echo "curl falló"
            head -c 200 /tmp/resp.txt 2>/dev/null || echo "(sin respuesta)"
            echo
          done

      - name: Recolectar datos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/actualizar_datos.py ${{ github.event_name == 'workflow_dispatch' && '--forzar' || '' }}

      - name: Publicar en la rama data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f data/generated/noticias.json || { echo "Faltan datos generados"; exit 1; }
          rm -rf /tmp/publicar && mkdir -p /tmp/publicar/data
          cp -r data/generated /tmp/publicar/data/
          cd /tmp/publicar
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Datos: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
