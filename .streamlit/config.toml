[theme]
primaryColor = "#2775AA"

[theme.light]
primaryColor = "#2775AA"
backgroundColor = "#FAF7E9"
secondaryBackgroundColor = "#F2EFE0"
textColor = "#171B18"

[theme.dark]
primaryColor = "#5AB0E6"
backgroundColor = "#121614"
secondaryBackgroundColor = "#181D1A"
textColor = "#FAF7E9"

[server]
enableCORS = true
enableXsrfProtection = true

[client]
showErrorDetails = "none"

[browser]
gatherUsageStats = false
