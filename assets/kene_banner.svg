    <rect x="506" y="55" width="6" height="6" fill="#D93829"/>
    <polygon points="691,46 703,58 691,70 679,58" fill="#FAF7E9" stroke="#171B18" stroke-width="2.5"/>
    <rect x="688" y="55" width="6" height="6" fill="#D93829"/>
    <polygon points="509,166 521,178 509,190 497,178" fill="#FAF7E9" stroke="#171B18" stroke-width="2.5"/>
    <rect x="506" y="175" width="6" height="6" fill="#D93829"/>
    <polygon points="691,166 703,178 691,190 679,178" fill="#FAF7E9" stroke="#171B18" stroke-width="2.5"/>
